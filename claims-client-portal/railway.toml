[railway]
  name = "claims-portal"
  description = "Definite Assurance Claims Portal"
  runtime = "python"

[build]
  command = "pip install -r claims-client-portal/requirements.txt"
  builder = "python"

[deploy]
  numReplicas = 1
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 10

[environment]
  CORE_API_BASE_URL = ""
  CORE_API_TOKEN = ""
  CLAIMS_HISTORY_DB = "claims_history.db"
