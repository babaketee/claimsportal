<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 68"
     role="img" aria-label="Definite Assurance">
  <title>Definite Assurance</title>
  <!--
    Palette:
      Aberdare Green  #0f4f48
      Uhuru Red       #eb2229
    Fonts: Arial Black / Helvetica Neue / Arial (safe web fallbacks)
  -->

  <!-- Full wordmark "Definite" in Aberdare Green -->
  <text x="0" y="52"
        font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
        font-size="54" font-weight="900" fill="#0f4f48">Definite</text>

  <!-- Uhuru Red checkmark overlaid on the D -->
  <text x="8" y="47"
        font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
        font-size="31" font-weight="900" fill="#eb2229">&#10003;</text>

  <!-- ASSURANCE subtext in Uhuru Red with generous letter-spacing -->
  <text x="2" y="67"
        font-family="Arial,Helvetica,sans-serif"
        font-size="11.5" font-weight="700" fill="#eb2229"
        letter-spacing="4.7">ASSURANCE</text>
</svg>
